<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img" aria-label="From generation to business use">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<rect width="840" height="430" rx="18" fill="#ffffff"/>
<text x="420.0" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#172033">From generation to business use</text>
<text x="420.0" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">A valid structured response is not necessarily a correct decision</text>
<rect x="35" y="90" width="350" height="100" rx="12" fill="#2563eb" fill-opacity=".065" stroke="#2563eb" stroke-width="2"/>
<text x="210.0" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#2563eb">1. Structured generation</text>
<text x="210.0" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Model + serving API</text>
<text x="210.0" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Request a supported schema</text>
<rect x="455" y="90" width="350" height="100" rx="12" fill="#15803d" fill-opacity=".065" stroke="#15803d" stroke-width="2"/>
<text x="630.0" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#15803d">2. Local validation</text>
<text x="630.0" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Application checks the contract</text>
<text x="630.0" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Handle invalid or missing output</text>
<rect x="455" y="245" width="350" height="100" rx="12" fill="#9333ea" fill-opacity=".065" stroke="#9333ea" stroke-width="2"/>
<text x="630.0" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#9333ea">3. Business assessment</text>
<text x="630.0" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Rules, evidence or evaluation</text>
<text x="630.0" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Human review where appropriate</text>
<rect x="35" y="245" width="350" height="100" rx="12" fill="#475569" fill-opacity=".065" stroke="#475569" stroke-width="2"/>
<text x="210.0" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#475569">4. Decide what to do</text>
<text x="210.0" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Accept, reject or review</text>
<text x="210.0" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Subject to business policy</text>
<path d="M385 140 H455" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="420" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">Candidate response</text>
<path d="M630 190 V245" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M455 295 H385" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>