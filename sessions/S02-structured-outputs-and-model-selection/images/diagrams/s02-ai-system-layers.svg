<rect width="840" height="430" rx="18" fill="#ffffff"/>
<text x="420.0" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#172033">Three engineering layers</text>
<text x="420.0" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Separate responsibilities — connected by requests and responses</text>
<rect x="25" y="120" width="245" height="150" rx="12" fill="#15803d" fill-opacity=".065" stroke="#15803d" stroke-width="2"/>
<text x="147.5" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#15803d">AI Application</text>
<text x="147.5" y="173" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Owns business workflow</text>
<text x="147.5" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Rules • permissions</text>
<text x="147.5" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Validation • user experience</text>
<rect x="298" y="120" width="245" height="150" rx="12" fill="#b45309" fill-opacity=".065" stroke="#b45309" stroke-width="2"/>
<text x="420.5" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#b45309">Model-serving API</text>
<text x="420.5" y="173" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Provides model access</text>
<text x="420.5" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Auth • routing • usage</text>
<text x="420.5" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Supported API features</text>
<rect x="570" y="120" width="245" height="150" rx="12" fill="#2563eb" fill-opacity=".065" stroke="#2563eb" stroke-width="2"/>
<text x="692.5" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#2563eb">LLM</text>
<text x="692.5" y="173" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Generates candidate output</text>
<text x="692.5" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Suggests ticket category</text>
<text x="692.5" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#172033">Does not own business rules</text>
