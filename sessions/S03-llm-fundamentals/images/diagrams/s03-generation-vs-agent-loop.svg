<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 505" width="760" height="505" role="img" aria-label="Generation loop nested within an agent loop"><title>Generation loop nested within an agent loop</title><defs><marker id="arrow-2563eb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker><marker id="arrow-15803d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#15803d"/></marker><marker id="arrow-9333ea" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#9333ea"/></marker><marker id="arrow-b45309" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b45309"/></marker><marker id="arrow-dc2626" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#dc2626"/></marker><marker id="arrow-172438" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#172438"/></marker><marker id="arrow-64748b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs><rect width="760" height="505" fill="#ffffff" rx="12"/><rect x="15" y="15" width="730" height="450" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="380" y="42" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">AGENT LOOP — S01</text><text x="380" y="64" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172438" text-anchor="middle">Outer workflow: model requests and authorized application actions</text><rect x="45" y="83" width="655" height="214" rx="9" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/><text x="372" y="108" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#9333ea" text-anchor="middle">ONE MODEL REQUEST — S03</text><text x="372" y="129" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172438" text-anchor="middle">Inner next-token generation loop</text><rect x="65" y="148" width="188" height="47" rx="9" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/><text x="159.0" y="176.5" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#9333ea" text-anchor="middle">Predict logits</text><polyline points="253,171 270,171" fill="none" stroke="#9333ea" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-9333ea)"/><rect x="271" y="148" width="188" height="47" rx="9" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/><text x="365.0" y="176.5" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#9333ea" text-anchor="middle">Select token</text><polyline points="459,171 476,171" fill="none" stroke="#9333ea" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-9333ea)"/><rect x="477" y="148" width="188" height="47" rx="9" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/><text x="571.0" y="176.5" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#9333ea" text-anchor="middle">Append token</text><polyline points="665,171 681,171 681,222 159,222 159,196" fill="none" stroke="#9333ea" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-9333ea)"/><text x="390" y="215" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#9333ea" text-anchor="middle">Repeat until stop</text><rect x="222" y="240" width="300" height="40" rx="9" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/><text x="372.0" y="265.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#9333ea" text-anchor="middle">Completed response</text><polyline points="372,297 372,313" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-2563eb)"/><rect x="120" y="315" width="505" height="52" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="372.5" y="338.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#15803d" text-anchor="middle">Application decides next action</text><text x="372.5" y="358.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172438" text-anchor="middle">Verify result or authorize and execute a tool</text><polyline points="372,367 372,384" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-64748b)"/><rect x="120" y="386" width="505" height="50" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="372.5" y="408.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#15803d" text-anchor="middle">Continue with observation / feedback</text><text x="372.5" y="428.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172438" text-anchor="middle">Or stop if complete, unsafe or budget exhausted</text><polyline points="625,411 722,411 722,75 372,75 372,83" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-2563eb)"/><text x="380" y="487" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="middle">A single model request does not require an Agent Loop.</text></svg>