<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 716" width="760" height="716" role="img" aria-label="Prompt-to-response lifecycle"><title>Prompt-to-response lifecycle</title><defs><marker id="arrow-2563eb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker><marker id="arrow-15803d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#15803d"/></marker><marker id="arrow-9333ea" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#9333ea"/></marker><marker id="arrow-b45309" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b45309"/></marker><marker id="arrow-dc2626" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#dc2626"/></marker><marker id="arrow-172438" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#172438"/></marker><marker id="arrow-64748b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs><rect width="760" height="716" fill="#ffffff" rx="12"/><rect x="190" y="20" width="380" height="52" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="380.0" y="43.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#15803d" text-anchor="middle">Input prompt</text><text x="380.0" y="63.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172438" text-anchor="middle">“Classify this login issue”</text><polyline points="380,72 380,91" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-64748b)"/><rect x="190" y="92" width="380" height="62" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="380.0" y="120.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#b45309" text-anchor="middle">Chat formatting + tokenizer</text><text x="380.0" y="140.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172438" text-anchor="middle">Text → token IDs</text><polyline points="380,154 380,172" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-64748b)"/><rect x="65" y="174" width="630" height="205" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="380" y="197" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">CORE LANGUAGE MODEL</text><rect x="190" y="209" width="380" height="47" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="380.0" y="229.5" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Embedding lookup</text><text x="380.0" y="249.5" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172438" text-anchor="middle">Token IDs → learned vectors</text><polyline points="380,256 380,264" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-64748b)"/><rect x="190" y="264" width="380" height="47" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="380.0" y="284.5" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Transformer layers</text><text x="380.0" y="304.5" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172438" text-anchor="middle">Process representations in context</text><polyline points="380,311 380,319" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-64748b)"/><rect x="190" y="319" width="380" height="47" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="380.0" y="339.5" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Output projection</text><text x="380.0" y="359.5" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172438" text-anchor="middle">Logits: score each possible next token</text><polyline points="380,379 380,398" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-64748b)"/><rect x="190" y="400" width="380" height="58" rx="9" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/><text x="380.0" y="426.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#9333ea" text-anchor="middle">Select next token ID</text><text x="380.0" y="446.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172438" text-anchor="middle">Greedy or sampling</text><polyline points="380,458 380,475" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-64748b)"/><rect x="190" y="477" width="380" height="58" rx="9" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/><text x="380.0" y="503.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#9333ea" text-anchor="middle">Append to sequence</text><text x="380.0" y="523.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#172438" text-anchor="middle">Stop condition met?</text><polyline points="570,506 720,506 720,165 380,165 380,174" fill="none" stroke="#9333ea" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-9333ea)"/><text x="645" y="494" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#9333ea" text-anchor="middle">No: repeat</text><polyline points="380,535 380,554" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-64748b)"/><text x="405" y="550" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Yes</text><rect x="190" y="555" width="380" height="48" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="380.0" y="584.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#b45309" text-anchor="middle">Decode IDs into text</text><polyline points="380,603 380,621" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-64748b)"/><rect x="190" y="622" width="380" height="48" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="380.0" y="651.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#15803d" text-anchor="middle">Response delivered</text><text x="380" y="696" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">Streaming can decode and deliver chunks during generation.</text></svg>